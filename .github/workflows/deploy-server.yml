name: Deploy Server to EC2

on:
  push:
    branches: [master]
    paths:
      - "__server__/**"
      - ".github/workflows/deploy-server.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: EC2 # environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Server to EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to your app directory
            cd /home/ubuntu/app-furcare

            # Pull latest changes
            git pull origin master  # Changed from main to master

            # Navigate to server directory
            cd server

            # Stop existing container if running
            docker stop furcare-server || true
            docker rm furcare-server || true

            # Build new image
            docker build -t furcare-server-image .

            # Run new container
            docker run -d \
              --name furcare-server \
              -p 3432:3432 \
              --restart unless-stopped \
              furcare-server-image

            # Clean up unused images
            docker image prune -f
