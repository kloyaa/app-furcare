name: Deploy Server to EC2

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: EC2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Server to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to home directory
            cd /home/ec2-user

            # Clone repo if it doesn't exist, otherwise pull
            if [ ! -d "app-furcare" ]; then
              git clone git@github.com:kloyaa/app-furcare.git app-furcare
            else
              cd app-furcare
              git pull origin master
              cd ..
            fi

            # Navigate to server directory
            cd app-furcare/server

            # Stop existing container if running
            docker stop furcare-server || true
            docker rm furcare-server || true

            # Build new image
            docker build -t furcare-server-image .

            # Run new container with environment variables
            docker run -d \
              --name furcare-server \
              -p 3432:3432 \
              -e DB_CONNECTION_STRING="${{ secrets.DB_CONNECTION_STRING }}" \
              --restart unless-stopped \
              furcare-server-image

            # Clean up unused images
            docker image prune -f
